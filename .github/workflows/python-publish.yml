
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Check Python syntax
        run: python -m py_compile miniserve-lite.py

      - name: Smoke test HTTP server
        env:
          SERVER_SCRIPT: ${{ github.workspace }}/miniserve-lite.py
        run: |
          python -c "
          import os
          import sys
          import time
          import socket
          import tempfile
          import subprocess
          import urllib.request

          server = os.environ['SERVER_SCRIPT']

          with tempfile.TemporaryDirectory() as directory:
              with open(os.path.join(directory, 'index.html'), 'w') as f:
                  f.write('Miniserve Lite CI works')

              with socket.socket() as sock:
                  sock.bind(('127.0.0.1', 0))
                  port = sock.getsockname()[1]

              process = subprocess.Popen(
                  [sys.executable, server, directory, str(port)],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              try:
                  for attempt in range(30):
                      if process.poll() is not None:
                          raise RuntimeError('Server exited unexpectedly')

                      try:
                          response = urllib.request.urlopen(
                              f'http://127.0.0.1:{port}/',
                              timeout=2
                          )
                          content = response.read().decode()
                          assert 'Miniserve Lite CI works' in content
                          print('HTTP smoke test passed')
                          break
                      except Exception:
                          time.sleep(1)
                  else:
                      raise RuntimeError('Server failed to start')
              finally:
                  process.terminate()
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait()
          "

